<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d0f14"/>
      <stop offset="100%" stop-color="#1a1d27"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.25" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#e63946" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#e63946" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.85" cy="0.7" r="0.5">
      <stop offset="0%" stop-color="#4cc9f0" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#4cc9f0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pbtop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b74"/>
      <stop offset="100%" stop-color="#e63946"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- 좌측 텍스트 -->
  <g transform="translate(80,180)">
    <text x="0" y="0" font-family="'Press Start 2P', 'Apple SD Gothic Neo', sans-serif"
          font-size="56" fill="#e63946" letter-spacing="2">Pokémon</text>
    <text x="0" y="80" font-family="'Press Start 2P', 'Apple SD Gothic Neo', sans-serif"
          font-size="56" fill="#f0f2ff" letter-spacing="2">성향 테스트</text>

    <line x1="0" y1="120" x2="120" y2="120" stroke="#e63946" stroke-width="4"/>

    <text x="0" y="180" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
          font-size="32" fill="#8892b0" font-weight="400">10개의 질문으로 알아보는</text>
    <text x="0" y="222" font-family="'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif"
          font-size="32" fill="#f0f2ff" font-weight="700">나와 가장 닮은 포켓몬은?</text>

    <!-- 태그 뱃지 -->
    <g transform="translate(0,270)">
      <rect x="0" y="0" width="120" height="36" rx="18" fill="#22263a"/>
      <text x="60" y="24" text-anchor="middle" font-family="'Apple SD Gothic Neo', sans-serif"
            font-size="16" fill="#ffd166" font-weight="700">PokéAPI</text>

      <rect x="132" y="0" width="150" height="36" rx="18" fill="#22263a"/>
      <text x="207" y="24" text-anchor="middle" font-family="'Apple SD Gothic Neo', sans-serif"
            font-size="16" fill="#4cc9f0" font-weight="700">Vanilla JS</text>
    </g>
  </g>

  <!-- 우측 포켓볼 -->
  <g transform="translate(900,315)">
    <circle cx="0" cy="0" r="220" fill="#1a1d27" stroke="#0d0f14" stroke-width="10"/>
    <path d="M-220,0 A220,220 0 0,1 220,0 Z" fill="url(#pbtop)"/>
    <rect x="-220" y="-18" width="440" height="36" fill="#0d0f14"/>
    <circle cx="0" cy="0" r="62" fill="#22263a" stroke="#0d0f14" stroke-width="10"/>
    <circle cx="0" cy="0" r="28" fill="#f0f2ff"/>
    <!-- 하이라이트 -->
    <ellipse cx="-90" cy="-110" rx="40" ry="16" fill="#ff6b74" opacity="0.5"/>
  </g>

  <!-- 하단 푸터 -->
  <text x="80" y="580" font-family="'Apple SD Gothic Neo', sans-serif"
        font-size="20" fill="#4a5270">Powered by PokéAPI · jtaehyeon.github.io</text>
</svg>
